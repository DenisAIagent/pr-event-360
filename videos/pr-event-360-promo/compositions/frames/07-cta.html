<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#07142F}
#root{width:1920px;height:1080px;position:relative;font-family:Inter,system-ui,-apple-system,sans-serif;overflow:hidden}
.clip{position:absolute;inset:0}
.bg-navy{background:radial-gradient(1400px 950px at 50% 100%,#1B3C6E 0%,#0D2044 45%,#07142F 100%)}
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:96px 120px}
.chip{display:inline-flex;align-items:center;gap:12px;padding:16px 30px;border-radius:999px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);font-size:25px;font-weight:650;color:#FFFFFF}
.led{width:10px;height:10px;border-radius:50%;background:#3FD08A;flex-shrink:0}
.h1{font-size:84px;font-weight:800;line-height:1.08;letter-spacing:-.026em;color:#FFFFFF}
.btn{display:inline-flex;align-items:center;gap:16px;padding:26px 52px;border-radius:14px;background:#1598D3;color:#FFFFFF;font-size:32px;font-weight:750;box-shadow:0 20px 46px rgba(21,152,211,.42)}
.arrow{width:13px;height:13px;border-top:3px solid #fff;border-right:3px solid #fff;transform:rotate(45deg)}
.url{font-size:24px;font-weight:550;color:rgba(255,255,255,.66)}
.ring{position:absolute;border-radius:50%;border:2px solid rgba(92,192,232,.13)}
</style>
</head>
<body>
<div id="root" data-composition-id="07-cta" data-start="0" data-duration="8.657" data-width="1920" data-height="1080">

  <div id="f7-bg" class="clip bg-navy" data-start="0" data-duration="8.657" data-track-index="0">
    <div class="ring" data-layout-allow-overflow style="width:1300px;height:1300px;left:50%;margin-left:-650px;bottom:-820px"></div>
    <div class="ring" data-layout-allow-overflow style="width:1700px;height:1700px;left:50%;margin-left:-850px;bottom:-1050px"></div>
  </div>

  <div id="f7-stage" class="clip stage" data-start="0" data-duration="8.657" data-track-index="1">

    <div style="display:flex;gap:18px;margin-bottom:64px">
      <div class="chip" id="b1" style="opacity:0"><span class="led"></span>Conforme RGPD</div>
      <div class="chip" id="b2" style="opacity:0"><span class="led"></span>Support en français</div>
      <div class="chip" id="b3" style="opacity:0"><span class="led"></span>Sans installation</div>
    </div>

    <div class="h1" id="cta-t" style="opacity:0">Pilotez votre prochain événement<br>à <span id="deg" style="color:#5CC0E8;display:inline-block">360°</span></div>

    <div class="btn" id="cta-btn" style="opacity:0;margin-top:56px">Demander un accès <span class="arrow"></span></div>

    <div class="url" id="cta-url" style="opacity:0;margin-top:34px">pr-event-360.app</div>

    <img id="cta-logo" src="assets/logo-pr-event-360-white.png" style="height:52px;margin-top:62px;opacity:0" onerror="this.style.display='none'">
  </div>

</div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });

// « Conforme RGPD, support en français, sans installation. »
tl.fromTo("#b1", {opacity:0,y:16}, {opacity:1,y:0,duration:0.4,ease:"power3.out"}, 0);
tl.fromTo("#b2", {opacity:0,y:16}, {opacity:1,y:0,duration:0.4,ease:"power3.out"}, 0.55);
tl.fromTo("#b3", {opacity:0,y:16}, {opacity:1,y:0,duration:0.4,ease:"power3.out"}, 2.25);

// « Demandez un accès… »
tl.fromTo("#cta-t", {opacity:0,y:26}, {opacity:1,y:0,duration:0.65,ease:"power3.out"}, 4.08);
tl.fromTo("#cta-btn", {opacity:0,y:18,scale:0.95}, {opacity:1,y:0,scale:1,duration:0.55,ease:"back.out(1.5)"}, 4.55);
tl.fromTo("#cta-url", {opacity:0}, {opacity:1,duration:0.45}, 5.60);
tl.fromTo("#cta-logo", {opacity:0}, {opacity:1,duration:0.5}, 6.30);

// « …à trois cent soixante degrés. »
tl.fromTo("#deg", {scale:1}, {scale:1.14,duration:0.35,ease:"back.out(2.2)"}, 7.20);
tl.to("#deg", {scale:1,duration:0.4,ease:"power2.out"}, 7.60);

window.__timelines["07-cta"] = tl;
</script>
</body>
</html>
